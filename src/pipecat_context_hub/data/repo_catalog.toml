# Curated catalog of public GitHub repos worth indexing beyond the defaults.
#
# Single source for the generated block in .env.example and the generated
# section in docs/configuration.md; regenerate both with `just catalog-regen`.
# `verified` is the date of the last manual audit; bump it with
# `just catalog-regen --bump-verified` after reviewing a clean health report.
#
# Public repos only: the schema rejects `private`, `archived` and `status` keys.
# One group per vendor (no catch-all group). `parseable = false` marks a repo that
# clones but yields no chunks (Swift/Kotlin/C++); hints skip it.
verified = 2026-10-16

[groups.client-sdks]
kind = "topic"
description = "Client SDKs and transports for web, mobile and native"
aliases = ["client sdk", "ios", "android", "esp32"]

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-ios"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-ios-daily"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-ios-small-webrtc"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-android"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-android-transports"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-cxx"
  note = "the Daily transport lives under transports/daily (pipecat-client-cxx-daily is archived)"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-esp32"
  parseable = false

  [[groups.client-sdks.repos]]
  slug = "pipecat-ai/pipecat-client-ios-gemini-live-websocket-demo"
