[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name carries the `pipecat-ai-` family prefix (the org's PyPI
# convention — official packages are pipecat-ai*). Everything user-facing
# after install — the command, the MCP server name, the data dir, the docs —
# stays `pipecat-context-hub`; see the scripts alias below.
name = "pipecat-ai-context-hub"
version = "0.5.3"
description = "Local-first MCP server providing fresh Pipecat docs/examples context for Claude Code, Cursor, VS Code, and Zed."
readme = "docs/README.md"
license = "BSD-2-Clause"
# Deliberately unbounded above, matching `pipecat-ai` — a cap here is viral for
# anyone installing alongside `pipecat-ai[cli]`. A new Python without wheels
# fails clearly at install time; that is not a reason to re-add one.
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "mcp>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "chromadb>=1.5,<2.0",
    # Inference stack. Both were already installed transitively via chromadb;
    # they are declared here because this package imports them directly (see
    # services/onnx_backend.py). Running the MiniLM models through ONNX Runtime
    # instead of sentence-transformers avoids a torch dependency, which on
    # Linux pulls 15 nvidia-* CUDA packages plus triton — 4.5 GB of GPU kernels
    # to run a 22 MB model that is pinned to the CPU.
    "onnxruntime>=1.17,<2.0",
    "tokenizers>=0.15,<1.0",
    "huggingface-hub>=0.20,<2.0",
    "numpy>=1.24,<3.0",
    # gitpython < 3.1.58: GHSA-3f7w-8rr8-f37f plus five more (GHSA-9rj7-rf2p-w77r,
    # GHSA-4gmw-gg2m-w46p, GHSA-hh9p-6wh2-4mfc, GHSA-wvpp-8hx9-p66j,
    # GHSA-jm78-9fvv-mhgr). Floor raised above the fixes so a plain re-lock
    # cannot regress to a vulnerable build.
    "gitpython>=3.1.58,<4.0",
    "click>=8.0,<9.0",
    "tree-sitter>=0.25,<1.0",
    "tree-sitter-typescript>=0.23,<1.0",
    "packaging>=21.0,<27.0",
    # cryptography < 50.0.0: CVE-2026-69247. Floor raised above the fix so a
    # plain re-lock cannot regress to a vulnerable build (the prior >=48.0.1 still
    # admitted 49.0.0).
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    # Peer dependency of `pipecat_context_hub.plugin`, supplied at runtime by
    # `pipecat-ai[cli]`. Needed here so the Typer bridge is covered by tests
    # rather than skipped, since it is not a runtime dependency of this package.
    "typer>=0.20.0,<1",
]

[project.scripts]
# The command (and MCP server name) is pipecat-context-hub everywhere.
pipecat-context-hub = "pipecat_context_hub.cli:main"
# Distribution-name alias so `uvx pipecat-ai-context-hub <cmd>` resolves
# (uvx runs the executable matching the package name).
pipecat-ai-context-hub = "pipecat_context_hub.cli:main"

# Mounts this CLI into the Pipecat CLI as `pipecat context-hub`, with `ch` as a
# hidden short alias. Discovery is dynamic, so installing this package
# alongside `pipecat-ai[cli]` is sufficient — no coordinated pipecat release is
# required. typer is a peer dependency supplied by that extra;
# `pipecat_context_hub.plugin` is imported only by the Pipecat CLI, never by
# this package's own entry points.
[project.entry-points."pipecat_cli.extensions"]
context-hub = "pipecat_context_hub.plugin:app"
# Short alias, hidden from `pipecat --help` so the command is listed once.
ch = "pipecat_context_hub.plugin:alias"

[tool.uv]
# Security floors for transitive dependencies the project does not import directly.
# Recorded as constraints (not project dependencies) so a plain `uv lock` keeps the
# fixed version instead of regressing to the highest version an intermediate package
# (e.g. an older fastapi) would otherwise allow.
constraint-dependencies = [
    # starlette < 1.0.1: Host-header validation bypass poisoning request.url.path
    # (PYSEC-2026-161 / GHSA-86qp-5c8j-p5mr). Reached only via mcp / fastapi /
    # sse-starlette; the hub speaks MCP over stdio and never serves HTTP itself.
    "starlette>=1.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_context_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "benchmark: latency and retrieval-quality benchmarks (deselect with -m 'not benchmark')",
    "smoke: live-network drift checks against upstream repos (reserved for the scheduled drift job; NOT applied to offline PR-gate fixture tests)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
    "^tests/fixtures/",
]

# Neither ships type stubs or a py.typed marker. Both are used only inside
# services/onnx_backend.py, which annotates its own public surface, so the
# untyped boundary stops there.
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

[dependency-groups]
dev = [
    "umap-learn>=0.5.11",
    "bandit>=1.8,<2.0",
    "cyclonedx-bom>=7.3,<8.0",
    "pip-audit>=2.8,<3.0",
    "lxml>=6.1.0",
]
