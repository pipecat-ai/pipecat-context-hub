name: Catalog health

# Weekly existence check for the curated repo catalog (parent plan Decision 6).
# Fails on a private, missing, archived or renamed entry, and on an
# inconclusive run (rate limit, 5xx, timeout) so it gets a re-run. Uses the
# job's GITHUB_TOKEN; PR CI never touches the network for this.

on:
  schedule:
    - cron: "0 7 * * 1"  # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    name: Check catalog repos
    runs-on: ubuntu-latest
    env:
      REPORT_PATH: catalog-health-report.md
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.18"

      - name: Sync dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Run catalog health check
        id: health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          uv run python scripts/check_repo_catalog.py | tee "${REPORT_PATH}"

      - name: Open or update tracking issue on failure
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: catalog-health
          TITLE: "catalog-health: repo catalog needs attention"
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -s "${REPORT_PATH}" ]; then
            echo "No report file produced; aborting issue update." >&2
            exit 1
          fi
          gh label create "${LABEL}" \
            --description "Repo catalog health check findings" \
            --color "B60205" \
            --force
          existing="$(gh issue list \
            --state open \
            --label "${LABEL}" \
            --json number \
            --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file "${REPORT_PATH}"
            gh issue comment "${existing}" \
              --body "Catalog health failed $(date -u +%FT%TZ) in run ${RUN_ID}."
          else
            gh issue create \
              --title "${TITLE}" \
              --label "${LABEL}" \
              --body-file "${REPORT_PATH}"
          fi

      - name: Fail job if the check failed
        if: steps.health.outcome == 'failure'
        run: |
          echo "Catalog health check failed; see the tracking issue." >&2
          exit 1
