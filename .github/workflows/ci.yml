name: CI

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "bug/**"
      - "refactor/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.9.18"

      - name: Sync dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Ruff
        run: uv run ruff check src/ tests/

      - name: Mypy
        run: uv run mypy src/ tests/

      - name: Pytest
        run: uv run pytest tests/ -v

  windows-smoke:
    name: Windows smoke (chromadb 1.x)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.9.18"

      - name: Sync dependencies
        # Proves chromadb 1.5.9 (and the rest of the stack) resolves and installs
        # from wheels on Windows — the primary cross-platform risk of the 1.x bump.
        run: uv sync --frozen --extra dev --group dev

      - name: ChromaDB index smoke
        # Scope: the chromadb 1.5.9 cross-platform risk surface. `Sync
        # dependencies` above already proved the wheel installs on Windows; these
        # tests then build real ChromaDB 1.x indexes in temp dirs and exercise the
        # upsert/query/get paths + Client.close lifecycle, the non-mutating
        # format-detection probe (reads chroma.sqlite3), and metadata typing.
        #
        # We deliberately do NOT run the whole unit suite on Windows: ~27 tests in
        # test_taxonomy / test_github_ingest / test_cli / test_hub_status assert
        # POSIX-style "/"-separated paths and fail under Windows "\\" separators.
        # That is pre-existing cross-platform test debt (the repo had no Windows
        # CI before) unrelated to the chromadb bump — tracked separately, not a
        # blocker for this migration. tests/integration/ is also excluded (its
        # serve tests use POSIX-only select() on pipes); Linux CI runs everything.
        run: >-
          uv run pytest -v
          tests/unit/test_index_store.py
          tests/unit/test_format_detection.py
          tests/unit/test_metadata_types.py

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.6.0
        with:
          version: "0.9.18"

      - name: Sync dependencies
        run: uv sync --frozen --extra dev --group dev

      - name: Dependency Audit
        # PYSEC-2026-139 (torch, CVE-2026-4538): local-only pt2-loader
        # deserialization with no upstream fix released. Reached only via
        # sentence-transformers; the hub never loads untrusted pt2 artifacts.
        #
        # CVE-2026-45829 (chromadb, GHSA-f4j7-r4q5-qw2c): pre-auth code injection
        # in chromadb's HTTP SERVER mode — arbitrary code execution via the
        # /api/v2/.../collections endpoint with a malicious model repo and
        # trust_remote_code=true. Affects 1.0.0-1.5.9 with no fixed release yet
        # (1.5.9 is the latest 1.x). Unreachable here: the hub runs the embedded
        # PersistentClient only (no server, no HTTP endpoint, no listener) and
        # never uses chromadb's embedding functions / trust_remote_code.
        #
        # The unfiltered biweekly security-audit.yml job re-surfaces both so the
        # ignores cannot silently outlive their upstream patches.
        run: >-
          uv run pip-audit --local --progress-spinner off
          --ignore-vuln PYSEC-2026-139
          --ignore-vuln CVE-2026-45829

      - name: Bandit
        run: uv run bandit -r src

      - name: Generate SBOM
        run: |
          mkdir -p artifacts/security
          uv run cyclonedx-py environment --output-reproducible --of JSON -o artifacts/security/sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/security/sbom.json
